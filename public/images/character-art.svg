<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024">
  <defs>
    <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#d4a843" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#7ecba1" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#7ecba1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="sword" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="768" height="1024" fill="url(#mist)" />

  <!-- cloak silhouette -->
  <path
    d="M160 980 C220 700 300 380 384 140 C468 380 548 700 608 980 Z"
    fill="url(#cloak)"
    filter="url(#soft)"
  />

  <!-- head/body hint -->
  <ellipse cx="384" cy="190" rx="48" ry="42" fill="#ffffff" fill-opacity="0.16" />
  <rect x="350" y="230" width="68" height="310" fill="#ffffff" fill-opacity="0.10" />

  <!-- sword -->
  <path
    d="M480 320 L628 840"
    stroke="#7ecba1"
    stroke-opacity="0.55"
    stroke-width="10"
    stroke-linecap="round"
    filter="url(#sword)"
  />
  <path
    d="M480 320 L628 840"
    stroke="#ffffff"
    stroke-opacity="0.35"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>

