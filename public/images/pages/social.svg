<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <radialGradient id="bg" cx="42%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#7ecba1" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#d4a843" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ecba1" stop-opacity="0"/>
      <stop offset="35%" stop-color="#7ecba1" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#d4a843" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g filter="url(#soft)" opacity="0.95">
    <circle cx="520" cy="420" r="220" stroke="#7ecba1" stroke-opacity="0.12" stroke-width="2"/>
    <circle cx="520" cy="420" r="170" stroke="#d4a843" stroke-opacity="0.10" stroke-width="2" stroke-dasharray="10 18"/>
    <circle cx="520" cy="420" r="120" stroke="#7ecba1" stroke-opacity="0.10" stroke-width="2"/>
    <path d="M740 420 C860 320 1000 320 1120 420" stroke="url(#pulse)" stroke-width="12" stroke-linecap="round"/>
    <path d="M740 500 C900 420 1020 420 1180 500" stroke="url(#pulse)" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  </g>

  <g opacity="0.30">
    <circle cx="1240" cy="240" r="1.6" fill="#ffffff" fill-opacity="0.7"/>
    <circle cx="1360" cy="300" r="1.4" fill="#d4a843"/>
    <circle cx="1460" cy="250" r="1.6" fill="#7ecba1"/>
  </g>
</svg>

