<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <radialGradient id="bg" cx="45%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#7ecba1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d77b" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#d4a843" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <g filter="url(#soft)" opacity="0.9">
    <rect x="320" y="180" width="520" height="640" rx="28" fill="url(#scroll)"/>
    <rect x="380" y="260" width="400" height="12" rx="6" fill="#7ecba1" fill-opacity="0.16"/>
    <rect x="380" y="310" width="360" height="12" rx="6" fill="#7ecba1" fill-opacity="0.14"/>
    <rect x="380" y="360" width="420" height="12" rx="6" fill="#7ecba1" fill-opacity="0.12"/>
    <rect x="380" y="410" width="320" height="12" rx="6" fill="#7ecba1" fill-opacity="0.10"/>
    <rect x="380" y="470" width="460" height="12" rx="6" fill="#d4a843" fill-opacity="0.12"/>
  </g>

  <g opacity="0.45">
    <circle cx="1180" cy="360" r="210" stroke="#d4a843" stroke-opacity="0.10" stroke-width="2"/>
    <circle cx="1180" cy="360" r="160" stroke="#7ecba1" stroke-opacity="0.10" stroke-width="2" stroke-dasharray="10 18"/>
  </g>

  <g opacity="0.30">
    <circle cx="1120" cy="210" r="1.6" fill="#ffffff" fill-opacity="0.7"/>
    <circle cx="1240" cy="260" r="1.4" fill="#d4a843"/>
    <circle cx="1320" cy="220" r="1.6" fill="#7ecba1"/>
  </g>
</svg>

