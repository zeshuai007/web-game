    <circle cx="520" cy="420" r="200" stroke="url(#ring)" stroke-width="2" stroke-dasharray="8 14" opacity="0.75"/>
    <circle cx="520" cy="420" r="140" stroke="url(#ring)" stroke-width="1.5" opacity="0.65"/>
