<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#7ecba1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1600" y2="0">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0"/>
      <stop offset="20%" stop-color="#d4a843" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#f5d77b" stop-opacity="0.16"/>
      <stop offset="80%" stop-color="#7ecba1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7ecba1" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
