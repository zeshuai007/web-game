      <stop offset="0%" stop-color="#7ecba1" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#d4a843" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
